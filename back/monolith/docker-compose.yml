# Monolith deployment on the Oracle server, run by deploy/monolith/deploy.sh. Caddy serves
# MONOLITH_DOMAIN: the API paths go to the monolith and the rest to the web. Both are reachable
# by a Caddy on the host (127.0.0.1:MONOLITH_HOST_PORT / WEB_HOST_PORT, deploy/monolith/Caddyfile)
# and by a Caddy in docker on caddy_net (aliases inkomi-monolith:3000 / inkomi-web:8080).
#
#   REGISTRY=ghcr.io/<owner> TAG=<sha> docker compose up -d
#
# The sandbox of the pipeline sets CADDY_NETWORK to a throwaway network and empty host ports
# (docker then picks free ones).
# The e2e profile runs the end-to-end tests against this stack:
#   docker compose --profile e2e run --rm e2e

name: inkomi-monolith

services:
  monolith:
    image: ${REGISTRY:-ghcr.io/ismelen}/inkomi-monolith:${TAG:?TAG is required}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
      # the workers' temp files on the data volume: the local storage hard links them
      TMPDIR: /app/data/tmp
      FIREBASE_CREDENTIALS_FILE: /app/firebase.json
      # the sandbox of the pipeline signs its upload urls for the compose network
      PUBLIC_URL: ${SANDBOX_PUBLIC_URL:-${PUBLIC_URL:-}}
    volumes:
      - ${DATA_PATH:-./data}:/app/data
      - ./firebase.json:/app/firebase.json:ro
    ports:
      - "127.0.0.1:${MONOLITH_HOST_PORT-3001}:3000"
    networks:
      default:
      caddy:
        aliases: [inkomi-monolith]

  web:
    image: ${REGISTRY:-ghcr.io/ismelen}/inkomi-web:${WEB_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT-8081}:8080"
    networks:
      default:
      caddy:
        aliases: [inkomi-web]

  e2e:
    profiles: [e2e]
    image: ${REGISTRY:-ghcr.io/ismelen}/inkomi-e2e:${E2E_TAG:-${TAG}}
    depends_on:
      monolith:
        condition: service_healthy
    environment:
      # the files live on the monolith's disk: check them through the API, not R2
      E2E_STORAGE: api
      AUTH_URL: http://monolith:3000
      LIBRARY_URL: http://monolith:3000
      TM_URL: http://monolith:3000
      PREVIEW_URL: http://monolith:3000
      RELEASE_URL: http://monolith:3000
    volumes:
      # R2 credentials to check and clean up what the tests store, and for upload-samples
      - ./.env:/app/.env:ro

networks:
  caddy:
    name: ${CADDY_NETWORK:-caddy_net}
    external: true
