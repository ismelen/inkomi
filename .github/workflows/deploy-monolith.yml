name: Deploy monolith (Docker Compose)

# Manual only. Deploys the monolith (back/monolith: every microservice in one process, with an
# embedded NATS and SQLite) to the Oracle server with Docker Compose:
#   1. unit tests (gofmt + go vet + go test -race, with libvips)
#   2. multi-arch images (amd64 + arm64) of the monolith and the e2e tests pushed to ghcr.io
#   3. on the server: preview samples to R2, e2e tests against a throwaway compose project and,
#      only if they pass, the production rollout with rollback (deploy/monolith/deploy.sh)
#
# Secrets: ORACLE_HOST, ORACLE_USERNAME, ORACLE_PRIVATE_KEY, ORACLE_SSH_PORT (default 22) and,
#          optionally, GHCR_PULL_TOKEN (PAT with read:packages; without it the job token is used).
# The env lives on the server at ~/inkomi/back/monolith/.env and firebase.json next to it (see
# back/monolith/.env.example and deploy/SERVERS.md). The web image is the latest one pushed by
# deploy-web.yml.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-monolith
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      registry: ${{ steps.plan.outputs.registry }}
    steps:
      - id: plan
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "tag=${GITHUB_SHA:0:12}"
            echo "registry=ghcr.io/${OWNER,,}"
          } | tee -a "$GITHUB_OUTPUT"

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back/monolith
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: back/monolith/go.mod
          cache-dependency-path: back/monolith/go.sum

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Format, vet and test
        run: |
          unformatted="$(gofmt -l .)"
          [[ -z "$unformatted" ]] || { echo "gofmt needed:"; echo "$unformatted"; exit 1; }
          go vet ./...
          go test -race ./...

  e2e-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back/microservices/e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: back/microservices/e2e/go.mod
          cache-dependency-path: back/microservices/e2e/go.sum

      - name: Vet and compile the e2e tests
        run: |
          go vet -tags e2e ./...
          go test -tags e2e -c -o /dev/null .

  images:
    needs: [plan, unit-tests, e2e-compile]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          # cgo + libvips: builds under emulation
          - image: monolith
            context: back/monolith
            file: back/monolith/Dockerfile
          - image: e2e
            context: back/microservices
            file: back/microservices/e2e/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: matrix.image == 'monolith'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.plan.outputs.registry }}/inkomi-${{ matrix.image }}:${{ needs.plan.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: [plan, images]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the deploy files
        run: |
          mkdir -p bundle
          cp back/monolith/docker-compose.yml deploy/monolith/deploy.sh deploy/monolith/Caddyfile bundle/

      - name: Clean the deploy files on the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          port: ${{ secrets.ORACLE_SSH_PORT || '22' }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          script: |
            rm -rf ~/inkomi-monolith/src
            mkdir -p ~/inkomi-monolith/src ~/inkomi/back/monolith

      - name: Copy the deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          port: ${{ secrets.ORACLE_SSH_PORT || '22' }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          source: "bundle/*"
          strip_components: 1
          target: "~/inkomi-monolith/src"

      - name: Sandbox tests and deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ secrets.GHCR_PULL_TOKEN && github.repository_owner || github.actor }}
          # without a PAT the job token pulls the images (enough: they stay cached on the server)
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          port: ${{ secrets.ORACLE_SSH_PORT || '22' }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          command_timeout: 45m
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            cp ~/inkomi-monolith/src/docker-compose.yml ~/inkomi/back/monolith/docker-compose.yml
            bash ~/inkomi-monolith/src/deploy.sh \
              --tag "${{ needs.plan.outputs.tag }}" \
              --registry "${{ needs.plan.outputs.registry }}" \
              --run "${{ github.run_id }}-${{ github.run_attempt }}"
