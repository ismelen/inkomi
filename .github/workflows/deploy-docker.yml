name: Deploy Backend (Docker)

# Manual only: never on push
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'back/api/go.mod'

      - name: Run tests
        run: |
          cd back/api
          go test ./...

  setup-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          script: |
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing Docker..."
              sudo dnf update -y
              sudo dnf install -y dnf-utils zip unzip
              sudo dnf config-manager --add-repo=https://download.docker.com/linux/centos/docker-ce.repo
              sudo dnf install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo systemctl enable docker --now
              sudo usermod -aG docker $USER
              echo "Docker installed successfully."
            else
              echo "Docker is already installed."
            fi

  deploy:
    needs: setup-docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download .env from server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ORACLE_HOST }} >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id_rsa ${{ secrets.ORACLE_USERNAME }}@${{ secrets.ORACLE_HOST }}:~/inkomi/back/api/.env ./back/api/.env || true

      - name: Clean old files on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          script: |
            rm -rf ~/inkomi/back/api/internal
            rm -f ~/inkomi/back/api/main.go
            mkdir -p ~/inkomi/back/api

      - name: Copy files via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          source: "back/api/internal,back/api/main.go,back/api/Dockerfile,back/api/docker-compose.yml,back/api/go.mod,back/api/go.sum,back/api/.dockerignore"
          target: "~/inkomi"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          script: |
            # Deploy using Docker Compose
            cd ~/inkomi/back/api
            sudo docker compose down
            sudo docker compose build --no-cache
            sudo docker compose up -d
