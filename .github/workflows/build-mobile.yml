name: Build and Deploy Mobile APK

on:
  push:
    branches:
      - master
    paths:
      - 'front/mobile/**'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.app_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Version Guard ────────────────────────────────────────────────────────
      - name: Get App Version
        id: app_version
        run: |
          VERSION=$(jq -r '.expo.version' front/mobile/app.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest GitHub Release version
        id: latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // "0.0.0"' 2>/dev/null || echo "0.0.0")
          # Strip leading 'v' if present
          LATEST="${LATEST#v}"
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Check version is bumped
        id: version_check
        run: |
          CURRENT="${{ steps.app_version.outputs.version }}"
          LATEST="${{ steps.latest_release.outputs.version }}"
          echo "Current version : $CURRENT"
          echo "Latest release  : $LATEST"

          # Compare using sort -V (version-aware sort)
          HIGHER=$(printf '%s\n%s\n' "$LATEST" "$CURRENT" | sort -V | tail -n1)
          if [ "$HIGHER" = "$CURRENT" ] && [ "$CURRENT" != "$LATEST" ]; then
            echo "bumped=true" >> $GITHUB_OUTPUT
            echo "✅ Version $CURRENT is higher than $LATEST — proceeding."
          else
            echo "bumped=false" >> $GITHUB_OUTPUT
            echo "⛔ Version $CURRENT is NOT higher than $LATEST — skipping build."
          fi

      - name: Abort if version not bumped
        if: steps.version_check.outputs.bumped == 'false'
        run: |
          echo "Version has not been bumped. Aborting workflow."
          exit 1
      # ─────────────────────────────────────────────────────────────────────────

  build:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Download .env and google-services.json from server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ORACLE_HOST }} >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id_rsa ${{ secrets.ORACLE_USERNAME }}@${{ secrets.ORACLE_HOST }}:~/inkomi/front/mobile/.env ./front/mobile/.env || true
          scp -i ~/.ssh/id_rsa ${{ secrets.ORACLE_USERNAME }}@${{ secrets.ORACLE_HOST }}:~/inkomi/front/mobile/google-services.json ./front/mobile/google-services.json || true

      - name: Install dependencies
        working-directory: ./front/mobile
        run: npm install

      - name: Expo Prebuild
        working-directory: ./front/mobile
        run: npx expo prebuild --platform android

      - name: Build Android APK
        working-directory: ./front/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Prepare APK for upload
        run: |
          mkdir -p build-output
          cp front/mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk build-output/inkomi.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkomi-apk
          path: build-output/inkomi.apk

  deploy:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: inkomi-apk
          path: build-output

      - name: Ensure directories exist on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          script: |
            sudo chown -R $USER:$USER ~/inkomi/back/api/resources || true
            mkdir -p ~/inkomi/back/api/resources
            chmod u+w ~/inkomi/back/api/resources || true
            rm -f ~/inkomi/back/api/resources/inkomi.apk || true

      - name: Copy APK to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          source: "build-output/inkomi.apk"
          target: "inkomi/back/api/resources"
          strip_components: 1
          overwrite: true

      - name: Update version file in resources
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          script: |
            VERSION_FILE=~/inkomi/back/api/resources/app-version.txt
            echo "${{ needs.check-version.outputs.app_version }}" > "$VERSION_FILE"

      # ─── GitHub Release ───────────────────────────────────────────────────────
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.app_version }}"
          TAG="v${VERSION}"
          gh release create "$TAG" \
            build-output/inkomi.apk \
            --title "Inkomi Mobile $TAG" \
            --notes "Release automática de la versión $VERSION del APK de Inkomi." \
            --latest
      # ─────────────────────────────────────────────────────────────────────────
