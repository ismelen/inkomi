name: Deploy web (image)

# Manual only. Builds the web app (front/web) and publishes its image; the api stack
# (back/api/docker-compose.yml) runs inkomi-web:latest and picks it up on its next deploy
# (Actions → Deploy api):
#   1. typecheck, prettier and build
#   2. multi-arch nginx image pushed to ghcr.io (<sha> and latest)
#
# Variables (public, baked into the bundle): DROPBOX_APP_KEY, GOOGLE_WEB_CLIENT_ID.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/web/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run build

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "tag=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: front/web
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_DROPBOX_API_KEY=${{ vars.DROPBOX_APP_KEY }}
            VITE_GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
          # latest is the one the api stack (back/api/docker-compose.yml) runs
          tags: |
            ${{ steps.meta.outputs.registry }}/inkomi-web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.registry }}/inkomi-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

