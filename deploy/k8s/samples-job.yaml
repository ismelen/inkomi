# Uploads the preview samples baked into the e2e image (back/manga-worker/samples) when they changed.
apiVersion: batch/v1
kind: Job
metadata:
  name: upload-samples
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: upload-samples
          image: ${REGISTRY}/inkomi-e2e:${TAG_E2E}
          imagePullPolicy: IfNotPresent
          command: ["/app/upload-samples"]
          volumeMounts:
            - { name: env, mountPath: /app/.env, subPath: .env, readOnly: true }
      volumes:
        - name: env
          secret:
            secretName: manga-worker-env
