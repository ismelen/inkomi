# Inkomi backend on k3s. Rendered by deploy/scripts/deploy.sh with envsubst:
#   ${NAMESPACE}       inkomi (production) or inkomi-sandbox-<run> (pipeline sandbox)
#   ${REGISTRY}        ghcr.io/<owner>, where the pipeline pushes the multi-arch images
#   ${TAG_<SERVICE>}   image tag of each service
#
# Scheduling by node capacity (label inkomi.io/capacity, see deploy/SERVERS.md):
#   high  manga-worker and epub-worker must run there (image processing, several GB of RAM)
#   low   everything else prefers it, so the big nodes stay free for the workers
# Adding a node is labelling it; more high nodes allow more manga/epub-worker replicas.
#
# Each service reads its own .env (Secret <service>-env, created from ~/inkomi/back/<service>/.env on
# the server) mounted at /app/.env. The in-cluster addresses below are set as env vars, which take
# precedence over the .env (godotenv never overrides the environment).
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: inkomi
---
# ─── NATS (JetStream) ────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: ${NAMESPACE}
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: ${NAMESPACE}
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: inkomi.io/capacity, operator: In, values: [low] }
      containers:
        - name: nats
          image: nats:2.11-alpine
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
# ─── Redis (epub-worker join groups) ─────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: ${NAMESPACE}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ${NAMESPACE}
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: inkomi.io/capacity, operator: In, values: [low] }
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--appendonly", "yes"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
# ─── auth-service ────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-service-data
  namespace: ${NAMESPACE}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ${NAMESPACE}
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 3100
    # internal routes for other services; never exposed by the ingress
    - name: internal
      port: 3101
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce volume: one pod at a time
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: inkomi.io/capacity, operator: In, values: [low] }
      imagePullSecrets:
        - name: ghcr
      securityContext:
        fsGroup: 10001
      containers:
        - name: auth-service
          image: ${REGISTRY}/inkomi-auth-service:${TAG_AUTH_SERVICE}
          imagePullPolicy: IfNotPresent
          env:
            - { name: PORT, value: "3100" }
            - { name: INTERNAL_PORT, value: "3101" }
            - { name: DB_PATH, value: /data/users.db }
          ports:
            - containerPort: 3100
            - containerPort: 3101
          readinessProbe:
            tcpSocket: { port: 3100 }
          livenessProbe:
            tcpSocket: { port: 3100 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: env, mountPath: /app/.env, subPath: .env, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: env
          secret:
            secretName: auth-service-env
        - name: data
          persistentVolumeClaim:
            claimName: auth-service-data
---
# ─── library-service ─────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: library-service
  namespace: ${NAMESPACE}
spec:
  selector:
    app: library-service
  ports:
    - name: http
      port: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-service
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-service
  template:
    metadata:
      labels:
        app: library-service
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: inkomi.io/capacity, operator: In, values: [low] }
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: library-service
          image: ${REGISTRY}/inkomi-library-service:${TAG_LIBRARY_SERVICE}
          imagePullPolicy: IfNotPresent
          env:
            - { name: PORT, value: "3001" }
            - { name: NATS_URL, value: "nats://nats:4222" }
          ports:
            - containerPort: 3001
          readinessProbe:
            tcpSocket: { port: 3001 }
          livenessProbe:
            tcpSocket: { port: 3001 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: env, mountPath: /app/.env, subPath: .env, readOnly: true }
      volumes:
        - name: env
          secret:
            secretName: library-service-env
---
# ─── transaction-manager ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transaction-manager-data
  namespace: ${NAMESPACE}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-manager
  namespace: ${NAMESPACE}
spec:
  selector:
    app: transaction-manager
  ports:
    - name: http
      port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-manager
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  # SQLite and the websocket hub live in the pod: one at a time
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: transaction-manager
  template:
    metadata:
      labels:
        app: transaction-manager
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: inkomi.io/capacity, operator: In, values: [low] }
      imagePullSecrets:
        - name: ghcr
      securityContext:
        fsGroup: 10001
      containers:
        - name: transaction-manager
          image: ${REGISTRY}/inkomi-transaction-manager:${TAG_TRANSACTION_MANAGER}
          imagePullPolicy: IfNotPresent
          env:
            - { name: NATS_URL, value: "nats://nats:4222" }
            - { name: DB_PATH, value: /data/transactions.db }
            - { name: SCHEMA_PATH, value: /app/migrations/transactions.sql }
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket: { port: 3000 }
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: env, mountPath: /app/.env, subPath: .env, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: env
          secret:
            secretName: transaction-manager-env
        - name: data
          persistentVolumeClaim:
            claimName: transaction-manager-data
---
# ─── manga-worker (jobs + public preview page) ───────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: manga-worker
  namespace: ${NAMESPACE}
spec:
  selector:
    app: manga-worker
  ports:
    - name: http
      port: 3003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manga-worker
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manga-worker
  template:
    metadata:
      labels:
        app: manga-worker
    spec:
      nodeSelector:
        inkomi.io/capacity: high
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: manga-worker
          image: ${REGISTRY}/inkomi-manga-worker:${TAG_MANGA_WORKER}
          imagePullPolicy: IfNotPresent
          env:
            - { name: PORT, value: "3003" }
            - { name: NATS_URL, value: "nats://nats:4222" }
            - { name: WORKERS, value: "2" }
            # Caddy sets X-Forwarded-For to the real client ip and Traefik keeps it (see SERVERS.md)
            - { name: PREVIEW_TRUST_PROXY, value: "true" }
          ports:
            - containerPort: 3003
          readinessProbe:
            tcpSocket: { port: 3003 }
          livenessProbe:
            tcpSocket: { port: 3003 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: env, mountPath: /app/.env, subPath: .env, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: env
          secret:
            secretName: manga-worker-env
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
---
# ─── epub-worker ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epub-worker
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epub-worker
  template:
    metadata:
      labels:
        app: epub-worker
    spec:
      nodeSelector:
        inkomi.io/capacity: high
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: epub-worker
          image: ${REGISTRY}/inkomi-epub-worker:${TAG_EPUB_WORKER}
          imagePullPolicy: IfNotPresent
          env:
            - { name: NATS_URL, value: "nats://nats:4222" }
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: env, mountPath: /app/.env, subPath: .env, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: env
          secret:
            secretName: epub-worker-env
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
---
# ─── push-service ────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: push-service
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: push-service
  template:
    metadata:
      labels:
        app: push-service
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: inkomi.io/capacity, operator: In, values: [low] }
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: push-service
          image: ${REGISTRY}/inkomi-push-service:${TAG_PUSH_SERVICE}
          imagePullPolicy: IfNotPresent
          env:
            - { name: NATS_URL, value: "nats://nats:4222" }
            - { name: AUTH_SERVICE_URL, value: "http://auth-service:3101" }
            - { name: FIREBASE_CREDENTIALS_FILE, value: /app/firebase.json }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: env, mountPath: /app/.env, subPath: .env, readOnly: true }
            - { name: env, mountPath: /app/firebase.json, subPath: firebase.json, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: env
          secret:
            secretName: push-service-env
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
