apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-service-data
  namespace: ${NAMESPACE}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ${NAMESPACE}
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 3100
    # internal routes for other services; never exposed by the ingress
    - name: internal
      port: 3101
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce volume: one pod at a time
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: inkomi.io/capacity, operator: In, values: [low] }
      imagePullSecrets:
        - name: ghcr
      securityContext:
        fsGroup: 10001
      containers:
        - name: auth-service
          image: ${REGISTRY}/inkomi-auth-service:${TAG_AUTH_SERVICE}
          imagePullPolicy: IfNotPresent
          env:
            - { name: PORT, value: "3100" }
            - { name: INTERNAL_PORT, value: "3101" }
            - { name: DB_PATH, value: /data/users.db }
          ports:
            - containerPort: 3100
            - containerPort: 3101
          readinessProbe:
            tcpSocket: { port: 3100 }
          livenessProbe:
            tcpSocket: { port: 3100 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: env, mountPath: /app/.env, subPath: .env, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: env
          secret:
            secretName: auth-service-env
        - name: data
          persistentVolumeClaim:
            claimName: auth-service-data
