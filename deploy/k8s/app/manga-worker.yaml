apiVersion: v1
kind: Service
metadata:
  name: manga-worker
  namespace: ${NAMESPACE}
spec:
  selector:
    app: manga-worker
  ports:
    - name: http
      port: 3003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manga-worker
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manga-worker
  template:
    metadata:
      labels:
        app: manga-worker
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: inkomi.io/capacity, operator: In, values: [high] }
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: manga-worker
          image: ${REGISTRY}/inkomi-manga-worker:${TAG_MANGA_WORKER}
          imagePullPolicy: IfNotPresent
          env:
            - { name: PORT, value: "3003" }
            - { name: NATS_URL, value: "nats://nats:4222" }
            - { name: WORKERS, value: "2" }
            # Caddy sets X-Forwarded-For to the real client ip and Traefik keeps it (see SERVERS.md)
            - { name: PREVIEW_TRUST_PROXY, value: "true" }
          ports:
            - containerPort: 3003
          readinessProbe:
            tcpSocket: { port: 3003 }
          livenessProbe:
            tcpSocket: { port: 3003 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: env, mountPath: /app/.env, subPath: .env, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: env
          secret:
            secretName: manga-worker-env
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
