apiVersion: v1
kind: Service
metadata:
  name: release-service
  namespace: ${NAMESPACE}
spec:
  selector:
    app: release-service
  ports:
    - name: http
      port: 3200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-service
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-service
  template:
    metadata:
      labels:
        app: release-service
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: inkomi.io/capacity, operator: In, values: [low] }
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: release-service
          image: ${REGISTRY}/inkomi-release-service:${TAG_RELEASE_SERVICE}
          imagePullPolicy: IfNotPresent
          env:
            - { name: PORT, value: "3200" }
          ports:
            - containerPort: 3200
          readinessProbe:
            tcpSocket: { port: 3200 }
          livenessProbe:
            tcpSocket: { port: 3200 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: env, mountPath: /app/.env, subPath: .env, readOnly: true }
      volumes:
        - name: env
          secret:
            secretName: release-service-env
